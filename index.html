<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的作品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 主頁就是那張書架場景圖；兩本書（和下方書名）是可以點的熱區 */
  :root{
    color-scheme:light;
    --sky:#cdc3e6;
    --sand:#f2c4cf;
    --ink:#3d3555;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --sans:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    --ratio:1.3396;   /* 2000 / 1493 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    position:relative;
    font-family:var(--sans);color:#fff;
    overflow-x:hidden;
    min-height:100vh;
    background:linear-gradient(180deg,var(--sky) 0%,#e6d4e6 55%,var(--sand) 100%);
  }
  /* 模糊放大的同一張圖：只在直式螢幕墊在圖的上下 */
  .backdrop{
    display:none;
    position:fixed;inset:-40px;
    background:url("書架.jpg") center/cover no-repeat;
    filter:blur(28px) saturate(1.1);opacity:.85;
  }
  /* 橫式螢幕：圖片滿版、左右貼齊，不裁切；比視窗高時往下捲就看得到全部 */
  .scene{
    position:relative;
    width:100%;
    aspect-ratio:2000 / 1493;
    overflow:hidden;
    transform-origin:var(--ox,50%) var(--oy,50%);
    transition:transform 1.1s cubic-bezier(.6,0,.2,1);
  }
  .scene img{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;display:block}

  .hot{
    position:absolute;display:block;border-radius:1.2% / 1.6%;
    outline:none;cursor:pointer;
    transition:box-shadow .3s,background .3s;
  }
  .hot:hover,.hot:focus-visible{
    background:rgba(255,255,255,.08);
    box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 46px 10px rgba(255,255,255,.55);
  }
  .hot.label{border-radius:12px}
  .hot.label:hover,.hot.label:focus-visible{background:rgba(255,255,255,.12);box-shadow:0 0 30px 6px rgba(255,255,255,.35)}
  /* 依原圖 2000×1493 的位置換算成百分比 */
  /* 書的位置與下緣的沙丘線，都是從原圖 2000×1493 量出來的 */
  .poems-book{left:23.8%;top:18.75%;width:24.3%;height:44.54%;
    --clip:polygon(-15% -15%, 115% -15%, 115% 93.2%, 100% 93.2%, 98.7% 93.2%, 91.2% 92.6%, 86.1% 92.8%, 76.1% 95%, 66% 95.5%, 58.4% 97.9%, 48.3% 98.3%, 38.2% 99.1%, 30.7% 98.3%, 23.1% 96.5%, 15.5% 93.2%, 8% 91.4%, 0.4% 90.2%, 0% 90.2%, -15% 90.2%)}
  .novel-book{left:54.6%;top:18.82%;width:24.15%;height:43.8%;
    --clip:polygon(-15% -15%, 115% -15%, 115% 84.4%, 100% 84.4%, 93.9% 85.5%, 88.8% 86.7%, 83.7% 90.1%, 78.6% 93.4%, 73.6% 95.3%, 66% 95.3%, 55.8% 95.1%, 48.2% 96.6%, 40.6% 98.6%, 33% 98.6%, 22.8% 97.4%, 15.2% 95.4%, 10.1% 91.9%, 0% 90.8%, -15% 90.8%)}

  /* 真正的書：蓋在圖裡的書上，下緣照沙丘線裁掉，看起來仍插在沙裡；
     上方和兩側多留空間，書封掀開往前傾時圓角才不會被切成直角 */
  .rbook{
    container-type:inline-size;
    perspective:1400px;
    clip-path:var(--clip);
    border-radius:0;
  }
  .rbook:hover,.rbook:focus-visible{background:none;box-shadow:none}
  /* 背景圖裡童詩集的左上角是直角；書改成右翻、左上角變圓之後，
     用天空的顏色蓋住那個露出來的直角 */
  /* 補丁直接用背景圖本身、取正上方一點點的天空，和周圍漸層接得上。
     換算：整張圖寬 = 書框寬 / 0.243 = 411.5cqw；書框左上角在圖上的 (97.94cqw, 57.6cqw) */
  .poems-book::before{
    content:"";position:absolute;left:0;top:0;width:6.2cqw;height:2.9cqw;
    background:url("書架.jpg") no-repeat;background-size:411.5cqw auto;
    background-position:-97.94cqw -54.5cqw;
  }
  .poems-book::after{content:none}
  .rbook .pages{
    position:absolute;inset:1.2% 1.2% 0 1.2%;
    border-radius:5.6cqw 1.4cqw 1.4cqw 1.4cqw;
    background:repeating-linear-gradient(90deg,#fbf6ec 0 2px,#ece2d0 2px 3px);
  }
  .rbook .cover{
    position:absolute;inset:0;overflow:hidden;
    border-radius:5.6cqw 1.4cqw 1.4cqw 1.4cqw;
    transform-origin:right center;
    transition:transform .9s cubic-bezier(.5,0,.2,1),filter .3s;
    box-shadow:inset -7px 0 10px -6px rgba(0,0,0,.35);
    color:#fff;
  }
  /* 翻動時也保持圓角（有些瀏覽器在 3D 轉動時會忽略 overflow 的圓角裁切） */
  .rbook .cover{clip-path:inset(0 round 5.6cqw 1.4cqw 1.4cqw 1.4cqw)}
  .novel-book .pages{border-radius:5.6cqw 1.4cqw 1.4cqw 1.4cqw}
  .novel-book .cover{clip-path:inset(0 round 5.6cqw 1.4cqw 1.4cqw 1.4cqw)}
  .novel-book .cover{transform-origin:right center;border-radius:5.6cqw 1.4cqw 1.4cqw 1.4cqw;box-shadow:inset -7px 0 10px -6px rgba(0,0,0,.4)}
  .rbook .cover img{width:100%;height:100%;object-fit:cover;display:block}
  /* 滑鼠移上去：書封微微掀開，亮一點 */
  .poems-book:hover .cover,.poems-book:focus-visible .cover{transform:rotateY(16deg);filter:brightness(1.06)}
  .novel-book:hover .cover,.novel-book:focus-visible .cover{transform:rotateY(16deg);filter:brightness(1.06)}
  .rbook:focus-visible{outline:3px solid #fff;outline-offset:4px}
  /* 點下去：書封整個翻開 */
  .rbook.opening{clip-path:none}
  .poems-book.opening .cover{transform:rotateY(165deg)}
  .novel-book.opening .cover{transform:rotateY(165deg)}

  .poems-book .t{
    position:absolute;top:8%;left:0;right:0;text-align:center;
    font-family:var(--serif);font-weight:900;font-size:13cqw;letter-spacing:.14em;margin-right:-.14em;
    text-shadow:0 3px 12px rgba(10,20,60,.45);
  }
  .poems-book .a{position:absolute;top:calc(8% + 17cqw);left:0;right:0;text-align:center;font-size:4.6cqw;letter-spacing:.4em;opacity:.9}
  .poems-book .au{position:absolute;top:calc(8% + 24cqw);left:0;right:0;text-align:center;font-size:4cqw;letter-spacing:.35em;opacity:.85;text-shadow:0 2px 8px rgba(10,20,60,.45)}
  .novel-book .cover{text-shadow:0 2px 10px rgba(30,30,90,.45)}
  .novel-book .t{
    position:absolute;top:8%;right:12%;writing-mode:vertical-rl;white-space:nowrap;
    font-family:var(--serif);font-weight:700;font-size:13cqw;letter-spacing:.08em;
  }
  .novel-book .s{position:absolute;top:8%;right:calc(12% + 24cqw);writing-mode:vertical-rl;font-size:4.2cqw;letter-spacing:.35em;opacity:.85}
  .novel-book .au{position:absolute;top:8%;left:12%;writing-mode:vertical-rl;font-size:4.2cqw;letter-spacing:.35em;opacity:.9}
  .poems-label{left:28.2%;top:78.5%;width:13.5%;height:9.5%}
  .novel-label{left:58.6%;top:78.5%;width:15.6%;height:9.5%}

  /* 標題疊在圖上方的天空裡（書從圖高 19% 才開始，不會壓到） */
  header{
    position:absolute;top:0;left:0;right:0;z-index:2;text-align:center;
    padding-top:2.4vw;pointer-events:none;
    color:#fff;text-shadow:0 3px 16px rgba(70,50,120,.55);
  }
  header h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.4vw,58px);letter-spacing:.22em;margin-right:-.22em}
  header p{margin-top:.5vw;font-size:clamp(11px,1vw,16px);letter-spacing:.32em}

  /* 直式螢幕（手機）：標題在上、整張圖在下，置中；上下墊模糊背景 */
  /* 直式螢幕（手機）：把場景放大、裁到兩本書那一段，左右貼齊螢幕；上下柔和地淡進背景 */
  @media (max-aspect-ratio:1/1){
    body{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:max(24px,env(safe-area-inset-top,0px)) 0 max(24px,env(safe-area-inset-bottom,0px));
    }
    html,body{overflow-x:clip}
    .backdrop{display:block}
    header{position:relative;padding:0 16px 6px}
    header h1{font-size:30px}
    header p{font-size:12px;margin-top:6px}
    .scene{
      flex:none;
      width:min(168vw, 112vh);
      margin-left:calc(min(168vw, 112vh) * -.028);   /* 讓兩本書的中心落在螢幕正中間 */
      -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);
      mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);
    }
  }

  .veil{position:fixed;inset:0;background:#fbf7ef;opacity:0;pointer-events:none;transition:opacity .5s ease .7s;z-index:50}
  .veil.on{opacity:1}
  @media (prefers-reduced-motion:reduce){.scene,.veil{transition:none}}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<header>
  <h1>我的作品</h1>
  <p>兒童文學期末創作　·　呂沛珍</p>
</header>

<main class="scene" id="scene">
  <img src="書架.jpg" alt="粉彩黏土風的小世界：木頭長凳上放著童詩集《何為事實》和小說《HQU 7.1》，旁邊有融化的鬧鐘、香菇與飛羊">
  <a class="hot rbook poems-book" href="poems.html" aria-label="打開童詩集《何為事實》">
    <span class="pages"></span>
    <span class="cover"><img src="童詩圖片/封面.jpg" alt=""><span class="t">何為事實</span><span class="a">童詩集</span><span class="au">呂沛珍　著</span></span>
  </a>
  <a class="hot rbook novel-book" href="novel.html" aria-label="打開小說《HQU 7.1》">
    <span class="pages"></span>
    <span class="cover"><img src="小說封面.png" alt=""><span class="t">HQU 7.1</span><span class="s">短篇小說</span><span class="au">呂沛珍</span></span>
  </a>
  <a class="hot label poems-label" href="poems.html" aria-label="打開童詩集《何為事實》" tabindex="-1"></a>
  <a class="hot label novel-label" href="novel.html" aria-label="打開小說《HQU 7.1》" tabindex="-1"></a>
</main>


<div class="veil" id="veil"></div>

<script>
  // 點書：鏡頭往那本書推進，畫面淡出後進入
  const scene = document.getElementById('scene');
  document.querySelectorAll('.hot').forEach(a => {
    a.addEventListener('click', e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();
      const book = a.classList.contains('label')
        ? scene.querySelector(a.getAttribute('href') === 'poems.html' ? '.poems-book' : '.novel-book')
        : a;
      const ox = (book.offsetLeft + book.offsetWidth / 2) / scene.offsetWidth * 100;
      const oy = (book.offsetTop + book.offsetHeight / 2) / scene.offsetHeight * 100;
      scene.style.setProperty('--ox', ox + '%');
      scene.style.setProperty('--oy', oy + '%');
      book.classList.add('opening');
      scene.style.transform = 'scale(2.4)';
      document.getElementById('veil').classList.add('on');
      setTimeout(() => { location.href = a.getAttribute('href'); }, 1250);
    });
  });
  // 從書頁按「上一頁」回來時復原
  addEventListener('pageshow', () => {
    scene.style.transform = '';
    scene.querySelectorAll('.opening').forEach(b => b.classList.remove('opening'));
    document.getElementById('veil').classList.remove('on');
  });
</script>
</body>
</html>
